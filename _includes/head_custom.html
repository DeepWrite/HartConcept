<!-- 한글 검색 지원을 위한 Lunr.js 패치 -->
<!-- Just-the-docs의 Lunr.js는 기본 trimmer가 ASCII 범위 외 문자를 제거하여 한글 검색이 불가능합니다. -->
<!-- Object.defineProperty로 lunr가 window에 할당되는 순간을 가로채어 trimmer를 교체합니다. -->
<script>
(function () {
  var _lunr = window.lunr;
  var koreanTrimmer = function (token) {
    return token.update(function (s) {
      return s
        .replace(/^[^\w\uAC00-\uD7A3\u1100-\u11FF\u3130-\u318F]+/, '')
        .replace(/[^\w\uAC00-\uD7A3\u1100-\u11FF\u3130-\u318F]+$/, '');
    });
  };
  var installKoreanTrimmer = function (value) {
    if (!value || !value.Pipeline) return;
    value.Pipeline.registerFunction(koreanTrimmer, 'trimmer');
    value.trimmer = koreanTrimmer;
  };

  Object.defineProperty(window, 'lunr', {
    configurable: true,
    get: function () {
      return _lunr;
    },
    set: function (value) {
      _lunr = value;
      installKoreanTrimmer(value);
    }
  });

  /* 기존 trimmer는 ASCII 단어 문자만 인식하므로 한글 범위를 보존한다.
     lunr가 먼저 로드된 경우와 나중에 할당되는 경우를 모두 처리한다. */
  installKoreanTrimmer(_lunr);
})();
</script>
